name: ruflet
description: Ruflet Flutter rendering engine for Ruby applications.
homepage: https://github.com/AdamMusa/ruflet
repository: https://github.com/AdamMusa/ruflet-engine
version: 0.81.0
publish_to: none # Local engine fork with vendored renderer dependencies.

# Supported platforms
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  battery_plus: ^7.0.0
  collection: ^1.19.0
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^12.3.0
  equatable: ^2.0.3
  file_picker: ^10.3.10
  flutter_highlight: ^0.7.0
  flutter_markdown_plus:
    path: vendor/flutter_markdown_plus
  flutter_math_fork:
    path: vendor/flutter_math_fork
  flutter_svg: ^2.2.1
  highlight: ^0.7.0
  http: ^1.5.0
  markdown: ^7.3.0
  msgpack_dart: ^1.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pasteboard: ^0.4.0
  provider: ^6.1.2
  screenshot: ^3.0.0
  screen_brightness: ^2.1.7
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  web: ^1.1.1
  web_socket_channel: ^3.0.2
  window_manager: ^0.5.1
  window_to_front: ^0.0.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  analyzer: ^9.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
